spring:
  application:
    name: cpi-assistant

# Only this machine can reach the app: /assist has no login, and with a tenant
# configured it reads that tenant. To serve others, put it behind a login
# (reverse proxy, SSO) first, then: --server.address=0.0.0.0
server:
  address: 127.0.0.1

# Chunking knobs. Override per run without editing source:
#   ./gradlew bootRun --args="--cpi.ingestion.max-segment-size=500 --cpi.ingestion.max-overlap-size=50"
cpi:
  ingestion:
    max-segment-size: 500
    max-overlap-size: 50
  # Relevance floor, on the store's (cosine + 1) / 2 scale, not raw cosine.
  # A chunk below it is not used. Measured on
  # the earlier hand-written docs: noise reached 0.82, some right chunks
  # scored just under 0.80. Model-specific (nomic with task prefixes).
  retrieval:
    min-score: 0.80

  # Which chat model answers. Switch the whole app with one property:
  #   ./gradlew bootRun --args="--cpi.chat.provider=anthropic"
  # Only the chosen provider needs its key. Embeddings stay on LM Studio.
  # Consumed by LangChain4jConfig, not by an auto-configuration.
  chat:
    provider: lmstudio            # lmstudio | openai | anthropic
    # Set on the model, not the HTTP client: the model's own timeout overrides it.
    timeout: 3m
    log-requests: true
    log-responses: true
    lmstudio:
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      # Qwen3 14B: answers from the passages and cites them. It thinks before
      # answering: better answers, ~10-30 s per question on an M-series Mac.
      model-name: qwen/qwen3-14b
      # 0 = always the most likely next token. Answers from docs should be
      # factual, not creative, and the evaluation needs repeatable runs.
      # (Qwen suggests ~0.6 when thinking, against endless repetition; 0 has
      # been fine on the demo questions so far.)
      temperature: 0.0
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      # Check the current list at platform.openai.com/docs/models. No
      # temperature: newer OpenAI models accept only their default.
      model-name: ${OPENAI_MODEL:gpt-5-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model-name: claude-opus-5-5
      # Thinking counts toward this limit.
      max-tokens: 16000

  # Where the vectors live. pgvector needs the container: docker compose up -d
  # memory: rebuilt on every start, gone on shutdown (tests use this).
  store:
    type: pgvector              # memory | pgvector
    pgvector:
      host: localhost
      port: 5433
      database: cpi
      user: ${CPI_DB_USER:cpi}
      password: ${CPI_DB_PASSWORD:cpi}   # the default is for the local Docker container only
      table: cpi_chunks
      dimension: 768            # nomic-embed-text-v1.5

  # The CPI tenant the tenant tools read (CpiTenantClient). Empty base-url: no
  # tenant, and the model is not offered the tenant tools. For a real tenant,
  # from its service key (never commit these values):
  #   export CPI_TENANT_URL=https://<tenant>.it-cpi<nnn>.cfapps.<region>.hana.ondemand.com/api/v1
  #   export CPI_TENANT_TOKEN_URL=https://<subaccount>.authentication.<region>.hana.ondemand.com/oauth/token
  #   export CPI_TENANT_CLIENT_ID=...  CPI_TENANT_CLIENT_SECRET=...
  # For development without a tenant: --spring.profiles.active=dev (a fake one).
  tenant:
    base-url: ${CPI_TENANT_URL:}
    token-url: ${CPI_TENANT_TOKEN_URL:}
    client-id: ${CPI_TENANT_CLIENT_ID:}
    client-secret: ${CPI_TENANT_CLIENT_SECRET:}

  # Skills (resources/skills, the loadSkill tool): off by default. Measured
  # with Qwen3 14B: the model never loaded a skill, and offering
  # loadSkill cost 2 of 10 right answers on tenant questions. Try it with a
  # stronger model: --cpi.agent.skills-enabled=true
  agent:
    skills-enabled: false

  # MCP servers whose tools the agent may use (AgentTools). None by default.
  # Official SAP servers only — no third-party ones. The one that fits: an MCP
  # Server you create in SAP Integration Suite (MCP gateway; premium/enhanced or
  # trial plan, Integration Cell), exposing your APIs as tools. It is reached over
  # streamable HTTP with OAuth client credentials from its service key; only the
  # tools named in allowed-tools reach the model. Example (values from env vars):
  #   mcp:
  #     servers:
  #       - name: sap-integration-suite
  #         url: ${SAP_MCP_URL}
  #         token-url: ${SAP_MCP_TOKEN_URL}
  #         client-id: ${SAP_MCP_CLIENT_ID}
  #         client-secret: ${SAP_MCP_CLIENT_SECRET}
  #         allowed-tools: [<tool names the server lists>]

  # The knowledge: official SAP Integration Suite docs only, as Markdown from
  # SAP's GitHub repository (CC BY 4.0) — help.sap.com itself is rendered by
  # JavaScript and disallows automated clients. KnowledgeService searches the
  # store and the best-matching page of sap-help/catalog.tsv, which it downloads
  # and saves the first time. A saved page is downloaded again after max-age.
  knowledge:
    sap-help-url: https://raw.githubusercontent.com/SAP-docs/btp-integration-suite/main
    max-age: 30d
    # A page is downloaded only if its title matches the question this well.
    # Measured: real CPI questions 0.83-0.95; off-topic ones up to 0.80.
    min-title-score: 0.82
    # Saved at startup (unless already saved and fresh), so common questions
    # never wait for a download. Page ids from sap-help/catalog.tsv.
    seed-on-startup: true
    seed-pages:
      - jdbc-receiver-adapter-88be644
      - http-receiver-adapter-2da452e
      - configure-the-sftp-receiver-adapter-4ef52cf
      - configure-the-odata-v2-receiver-adapter-c5c2e38
      - handle-errors-gracefully-42c95f7
      - define-exception-subprocess-690e078
      - using-script-api-methods-in-groovy-scripts-062f7a7
      - define-content-modifier-8f04a70
      - message-processing-log-b32f8cd
      - monitor-message-processing-314df3f

# Embedding model, consumed by LangChain4jConfig. A separate model on the same
# LM Studio server. It returns vectors, not text. nomic-embed-text-v1.5
# produces 768 dimensions. Request logging stays off: a page's worth of
# chunks is unreadable.
langchain4j:
  open-ai:
    embedding-model:
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      model-name: text-embedding-nomic-embed-text-v1.5
      timeout: 3m
      # nomic is trained with asymmetric task prefixes: questions and documents
      # are embedded differently. Model-specific — an OpenAI embedding model
      # wants both empty, which is why they live here and not in code.
      query-prefix: "search_query: "
      document-prefix: "search_document: "
