spring:
  application:
    name: cpi-assistant

  # Track B — Spring AI. The /v1 suffix IS required here. Spring AI 1.x
  # appended /v1 itself; 2.0 delegates to the official openai-java SDK, which
  # does not. Getting this wrong is not a 404: LM Studio answers an unknown
  # path with HTTP 200 and {"error": "Unexpected endpoint or method"}, so the
  # SDK parses it as a completion and fails with "`choices` is not set".
  ai:
    openai:
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      chat:
        model: meta-llama-3.1-8b-instruct

# Chunking knobs. Override per run without editing source:
#   ./gradlew bootRun --args="--cpi.ingestion.max-segment-size=500 --cpi.ingestion.max-overlap-size=50"
cpi:
  ingestion:
    max-segment-size: 500
    max-overlap-size: 50
  # Relevance floor, on the store's (cosine + 1) / 2 scale, not raw
  # cosine. 0.80 sits between off-topic noise (<= 0.79) and real hits (>= 0.86)
  # as measured at (500, 50) with nomic task prefixes. Model-specific.
  retrieval:
    min-score: 0.80

# Track A — LangChain4j. Same LM Studio server, full /v1 base URL.
# Consumed by LangChain4jConfig, not by an auto-configuration.
langchain4j:
  open-ai:
    chat-model:
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      model-name: meta-llama-3.1-8b-instruct
      log-requests: true
      log-responses: true

    # Embedding model — a separate model, same LM Studio server. It returns vectors,
    # not text. nomic-embed-text-v1.5 produces 768 dimensions.
    # Request logging stays off here: 207 segments of payload is unreadable.
    embedding-model:
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      model-name: text-embedding-nomic-embed-text-v1.5
      # nomic is trained with asymmetric task prefixes: questions and documents
      # are embedded differently. Model-specific — an OpenAI embedding model
      # wants both empty, which is why they live here and not in code.
      query-prefix: "search_query: "
      document-prefix: "search_document: "
