spring:
  application:
    name: cpi-assistant

  # Track B — Spring AI. Note the base-url has no /v1 suffix: Spring AI
  # appends /v1/chat/completions itself, unlike LangChain4j below.
  ai:
    openai:
      base-url: http://localhost:1234
      api-key: lm-studio
      chat:
        model: meta-llama-3.1-8b-instruct

# Step 4 — chunking knobs. Override per run without editing source:
#   ./gradlew bootRun --args="--cpi.ingestion.max-segment-size=500 --cpi.ingestion.max-overlap-size=50"
cpi:
  ingestion:
    max-segment-size: 200
    max-overlap-size: 0

# Track A — LangChain4j. Same LM Studio server, full /v1 base URL.
# Consumed by LangChain4jConfig, not by an auto-configuration.
langchain4j:
  open-ai:
    chat-model:
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      model-name: meta-llama-3.1-8b-instruct
      log-requests: true
      log-responses: true
