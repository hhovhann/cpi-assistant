# Development without a real tenant: ./gradlew bootRun --args="--spring.profiles.active=dev"
# A fake CPI tenant runs inside this app (fake.FakeCpiController) with the same
# paths and JSON as the real OData API, and a few planted failures.
cpi:
  tenant:
    fake: true
    base-url: http://localhost:${server.port:8080}/fake-cpi/api/v1
    token-url: ""
