<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPI Assistant</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1d232b;
    --muted: #5f6b7a;
    --border: #dde2e8;
    --accent: #0b6bcb;
    --accent-soft: #e3f0fc;
    --warn: #9a5b00;
    --warn-soft: #fff3de;
    --danger: #b3261e;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b;
      --surface: #1b2129;
      --text: #e4e8ee;
      --muted: #97a3b3;
      --border: #2d3642;
      --accent: #5aa9f5;
      --accent-soft: #1d3246;
      --warn: #f0b35a;
      --warn-soft: #3a2c16;
      --danger: #f2837a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 4px 0 0; color: var(--muted); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.ready { background: #2e9e5b; }

  form { display: flex; gap: 8px; margin-top: 20px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    padding: 0 20px; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: var(--radius); cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  .options { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 12px; font-size: 14px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .example {
    padding: 4px 10px; font: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft);
    border: 0; border-radius: 999px; cursor: pointer;
  }
  label.compare { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }

  .results { display: grid; gap: 16px; margin-top: 24px; }
  .results.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 800px) { .results.two { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
  .card h2 { margin: 0 0 2px; font-size: 16px; }
  .card .sub { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .error { color: var(--danger); }
  .loading { color: var(--muted); font-style: italic; }

  .cite {
    display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; font: inherit; font-size: 12px; font-weight: 600;
    line-height: 18px; text-align: center; vertical-align: 1px; color: var(--accent); background: var(--accent-soft);
    border: 0; border-radius: 5px; cursor: pointer;
  }

  .sources { margin-top: 16px; }
  .sources h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .source { padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; transition: box-shadow .2s; }
  .source.flash { box-shadow: 0 0 0 2px var(--accent); }
  .source .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 14px; }
  .source .file { font-weight: 600; overflow-wrap: anywhere; }
  .source .score { font-size: 12px; color: var(--muted); }
  .source .excerpt { margin-top: 4px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .source.unused { opacity: .6; border-style: dashed; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; color: var(--warn); background: var(--warn-soft); }

  .path { margin: 0 0 12px; padding: 8px 12px; list-style: none; font-size: 13px; color: var(--muted);
          background: var(--bg); border-radius: 8px; }
  .path li { padding: 2px 0; overflow-wrap: anywhere; }
  .path li::before { content: "→ "; }
  .path li.web { color: var(--warn); }
  .cite.text { min-width: 0; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
  .cite.unknown { color: var(--warn); background: var(--warn-soft); cursor: help; }
  .source a { color: var(--accent); }
  .tools { margin-top: 16px; }
  .tools h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .step { padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; }
  .step .tool { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .step .args { margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .step details { margin-top: 6px; font-size: 13px; }
  .step summary { cursor: pointer; color: var(--muted); }
  .step pre { margin: 6px 0 0; padding: 8px; max-height: 280px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
              font-size: 12px; background: var(--bg); border-radius: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>CPI Assistant</h1>
    <p>Answers SAP Cloud Integration questions from the official SAP documentation, and looks at the CPI tenant when needed.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  </header>

  <form id="form">
    <input type="text" id="question" placeholder="Ask about SAP CPI…" autocomplete="off" required>
    <button class="primary" id="ask" type="submit" disabled>Ask</button>
  </form>

  <div class="options">
    <div class="examples">
      <button class="example" type="button">How do I configure a JDBC adapter?</button>
      <button class="example" type="button">How do I handle errors in an iFlow?</button>
      <button class="example" type="button">How do I configure the AS4 receiver adapter?</button>
      <button class="example" type="button">Why did Order_Sync fail today and how do I fix it?</button>
    </div>
  </div>

  <section class="results" id="results"></section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const form = $('form'), questionInput = $('question'), askButton = $('ask'), results = $('results');

  // Everything the model or a remote system writes is untrusted text. Escape
  // it before it goes anywhere near innerHTML.
  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  // Only links into SAP's documentation repository become links.
  function safeLink(url, label) {
    return url && /^https:\/\/github\.com\/SAP-docs\/[\w./-]+$/.test(url)
      ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>` : escapeHtml(label);
  }

  // On escaped text: **bold**, and [Page Title] as a chip. The server says
  // which titles the model was given; any other title gets a warning chip.
  function renderAnswer(text, sourceIndex, unverified) {
    const html = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return html.replace(/\[([^\[\]\n]{3,150})]/g, (whole, label) => {
      const title = label.replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"');
      if (sourceIndex.has(title)) {
        return `<button class="cite text" type="button" data-src="${sourceIndex.get(title)}" title="Show the source">${label}</button>`;
      }
      return unverified.includes(title)
        ? `<span class="cite text unknown" title="The model was never given this page — it cited it anyway">⚠ ${label}</span>`
        : whole;
    });
  }

  async function ask(question, el) {
    const started = performance.now();
    try {
      const response = await fetch('/assist?question=' + encodeURIComponent(question));
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();

      const sourceIndex = new Map(data.sources.map((s, i) => [s.title, i]));
      const answer = el.querySelector('.answer');
      answer.className = 'answer';
      answer.innerHTML = renderAnswer(data.answer, sourceIndex, data.unverifiedCitations);

      answer.insertAdjacentHTML('beforebegin', '<ul class="path">' + data.path.map(step =>
        `<li class="${/downloaded|^Tool:/.test(step) ? 'web' : ''}">${escapeHtml(step)}</li>`).join('') + '</ul>');

      const sources = document.createElement('div');
      sources.className = 'sources';
      sources.innerHTML = '<h3>Sources</h3>' + (data.sources.length === 0
        ? '<div class="source unused">No documentation was found for this question.</div>'
        : data.sources.map((s, i) => `
            <div class="source ${s.cited ? '' : 'unused'}" id="src-${i}">
              <div class="head"><span class="file">${safeLink(s.url, s.title)}</span>
                ${s.score == null ? '' : `<span class="score">relevance ${s.score.toFixed(3)}</span>`}
                ${s.cited ? '' : '<span class="tag">given, not cited</span>'}</div>
              ${s.excerpt ? `<div class="excerpt">${escapeHtml(s.excerpt)}</div>` : ''}
            </div>`).join(''));
      answer.after(sources);

      let last = sources;
      if (data.toolCalls.length) {
        const tools = document.createElement('div');
        tools.className = 'tools';
        tools.innerHTML = '<h3>Tool calls</h3>' + data.toolCalls.map((call, i) => `
            <div class="step">
              <span class="tool">${i + 1}. ${escapeHtml(call.tool)}</span>
              <div class="args">${escapeHtml(call.arguments || '{}')}</div>
              <details><summary>Result (${(call.result || '').length} chars)</summary><pre>${escapeHtml(call.result || '')}</pre></details>
            </div>`).join('');
        sources.after(tools);
        last = tools;
      }

      const warning = data.unverifiedCitations.length
        ? ` · <span class="tag">${data.unverifiedCitations.length} citation(s) of pages the model was never given</span>` : '';
      last.insertAdjacentHTML('afterend',
        `<div class="meta">${data.toolCalls.length} tool call(s) · ${data.inputTokens} tokens in / ${data.outputTokens} out · `
        + `${(data.millis / 1000).toFixed(1)} s${warning}</div>`);
    } catch (e) {
      el.querySelector('.answer').className = 'answer error';
      el.querySelector('.answer').textContent =
        `Request failed (${e.message}). Is the app running, LM Studio serving both models, and pgvector up (docker compose up -d)?`;
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;
    results.replaceChildren();
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = '<h2>Answer</h2><div class="answer loading">Thinking… a download or a tool call can take a minute or two.</div>';
    results.append(el);
    askButton.disabled = true;
    await ask(question, el);
    askButton.disabled = false;
  });

  // Clicking a citation chip highlights its source.
  results.addEventListener('click', event => {
    const chip = event.target.closest('button.cite');
    if (!chip) return;
    const target = $(`src-${chip.dataset.src}`);
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 1200);
  });

  document.querySelectorAll('.example').forEach(button =>
    button.addEventListener('click', () => {
      questionInput.value = button.textContent;
      if (!askButton.disabled) form.requestSubmit();
    }));

  // At startup the server saves a few popular SAP pages. Wait for it.
  async function pollStatus() {
    try {
      const status = await (await fetch('/status')).json();
      if (status.ready) {
        $('dot').classList.add('ready');
        $('status').textContent = `Ready · ${status.savedPages} of ${status.seedPages} popular SAP pages in the database`;
        askButton.disabled = false;
        return;
      }
      $('status').textContent = 'Saving popular SAP pages to the database…';
    } catch {
      $('status').textContent = 'Server not reachable — retrying…';
    }
    setTimeout(pollStatus, 1000);
  }
  pollStatus();
</script>
</body>
</html>
